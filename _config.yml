# GitHub Pages Configuration
# This file tells GitHub Pages which files/folders to exclude from publishing

# Exclude developer documentation and sensitive files
exclude:
  - .github/
  - .claude/
  - docs/
  - documents/
  - README.md
  - youtube_posted.json  # Bot tracking file (keep private)
  - .gitignore
  - CODEOWNERS
  - LICENSE

# NOTE: data/resource-ratings.json is intentionally NOT excluded
# It needs to be publicly accessible for the rating system to work

# Keep Jekyll processing disabled for faster builds
# (we're using plain HTML/CSS/JS, not Jekyll features)
