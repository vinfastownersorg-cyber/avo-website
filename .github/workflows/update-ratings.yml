name: Update Resource Ratings

on:
  # Manual trigger via GitHub UI
  workflow_dispatch:
    inputs:
      votes:
        description: 'Votes to add (format: resource-id:count,resource-id:count)'
        required: true
        default: 'vf8-manual:5,vf9-manual:3'

  # Scheduled - runs daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

jobs:
  update-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check if ratings file exists
        run: |
          if [ ! -f "data/resource-ratings.json" ]; then
            echo "❌ resource-ratings.json not found!"
            exit 1
          fi

      - name: Update ratings (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from datetime import datetime

          # Load current ratings
          with open('data/resource-ratings.json', 'r') as f:
              ratings = json.load(f)

          # Parse input votes
          votes_input = "${{ github.event.inputs.votes }}"
          updates = {}

          for vote in votes_input.split(','):
              vote = vote.strip()
              if ':' in vote:
                  resource_id, count_str = vote.split(':')
                  resource_id = resource_id.strip()
                  try:
                      count = int(count_str.strip())
                      if resource_id in ratings and resource_id != 'last_updated':
                          updates[resource_id] = count
                  except ValueError:
                      pass

          # Apply updates
          changes_made = False
          for resource_id, count in updates.items():
              old_count = ratings[resource_id]
              ratings[resource_id] = old_count + count
              print(f"✓ {resource_id}: {old_count} → {ratings[resource_id]} (+{count})")
              changes_made = True

          if changes_made:
              # Update timestamp
              ratings['last_updated'] = datetime.utcnow().isoformat() + 'Z'

              # Save updated ratings
              with open('data/resource-ratings.json', 'w') as f:
                  json.dump(ratings, f, indent=2)

              print(f"\n✅ Ratings updated at {ratings['last_updated']}")
          else:
              print("ℹ️ No valid updates to apply")
          PYTHON_SCRIPT

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/resource-ratings.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/resource-ratings.json
          git commit -m "Update resource ratings via GitHub Actions

          Automated rating update triggered by: ${{ github.event_name }}

          🤖 Generated by GitHub Actions"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Rating Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Ratings updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes made" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Current Ratings:**" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat data/resource-ratings.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
