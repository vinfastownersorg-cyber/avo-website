name: Daily VinFast News Updates

on:
  schedule:
    # Runs at 12:00 AM UTC (7:00 PM EST / 4:00 PM PST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  post-news:
    name: Fetch and Post VinFast News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests feedparser beautifulsoup4 lxml

      - name: Fetch VinFast news and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import os
          from datetime import datetime, timedelta
          import sys
          from urllib.parse import quote

          # Get Discord webhook URL from environment
          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL')

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK_URL secret not set")
              sys.exit(1)

          print("🔍 Fetching VinFast news from multiple sources...")

          # News sources
          news_articles = []

          # Source 1: Bing News RSS for VinFast - provides direct article links
          try:
              print("📰 Checking Bing News...")
              # Bing News RSS provides direct links (no redirects)
              bing_news_url = "https://www.bing.com/news/search?q=VinFast&format=rss"
              feed = feedparser.parse(bing_news_url)

              # Get articles from last 24 hours
              cutoff_time = datetime.now() - timedelta(days=1)

              # Priority keywords for North America
              na_keywords = ['us', 'usa', 'united states', 'america', 'california', 'north carolina',
                            'texas', 'canada', 'dealership', 'delivery', 'recall', 'safety',
                            'nhtsa', 'epa', 'nasdaq', 'stock']

              for entry in feed.entries[:50]:  # Check top 50 entries
                  try:
                      published = datetime(*entry.published_parsed[:6])

                      if published > cutoff_time:
                          title = entry.title.lower()
                          summary = entry.summary.lower() if hasattr(entry, 'summary') else ''

                          # STRICT FILTER: Must have "vinfast" prominently in title or first 200 chars of summary
                          # This prevents articles that just have VinFast mentioned in passing
                          vinfast_in_title = 'vinfast' in title
                          vinfast_in_early_summary = 'vinfast' in summary[:200] if summary else False

                          # Skip if VinFast is not prominently featured
                          if not (vinfast_in_title or vinfast_in_early_summary):
                              print(f"   ⏭️  Skipping (VinFast not prominent): {entry.title[:60]}...")
                              continue

                          # Additional exclusion filters for common false positives
                          exclusion_keywords = [
                              'rivian', 'tesla', 'lucid', 'nio', 'xpeng', 'byd only',
                              'general motors', 'ford motor', 'volkswagen group',
                              'ev stocks', 'ev market', 'ev sector', 'chinese evs'
                          ]

                          # Check if article is primarily about other EVs/companies
                          is_excluded = False
                          for exclude_word in exclusion_keywords:
                              # If exclusion keyword appears in title but VinFast doesn't, skip it
                              if exclude_word in title and 'vinfast' not in title:
                                  print(f"   ⏭️  Skipping (about {exclude_word}): {entry.title[:60]}...")
                                  is_excluded = True
                                  break

                          if is_excluded:
                              continue

                          # Block known SEO spam domains and garbage content patterns
                          spam_sources = ['newser.com', 'newser']

                          # Garbage title patterns (financial spam)
                          garbage_patterns = [
                              'equity warrant', 'technical indicators', 'price floor',
                              'momentum shifts', 'forecast', 'time series', 'drawdowns',
                              'statistical tools', 'reversal', 'sector etf'
                          ]

                          source_name = entry.source.title.lower() if hasattr(entry, 'source') else ''
                          article_url = entry.link.lower()

                          # Skip any article from spam sources
                          if any(spam_domain in article_url or spam_domain in source_name for spam_domain in spam_sources):
                              print(f"   ⏭️  Skipping (spam source - {source_name}): {entry.title[:60]}...")
                              continue

                          # Skip garbage financial content by title patterns
                          is_garbage = any(pattern in title for pattern in garbage_patterns)
                          if is_garbage:
                              print(f"   ⏭️  Skipping (financial spam): {entry.title[:60]}...")
                              continue

                          # Calculate relevance score (for North America priority)
                          relevance = 0
                          for keyword in na_keywords:
                              if keyword in title:
                                  relevance += 3  # Title matches worth more
                              if keyword in summary:
                                  relevance += 1

                          # Boost relevance if VinFast is in title
                          if vinfast_in_title:
                              relevance += 5

                          # Clean title - remove source suffix
                          clean_title = entry.title
                          if ' - ' in clean_title:
                              # Keep the main part, source is in entry.source
                              clean_title = clean_title.rsplit(' - ', 1)[0].strip()

                          # Get article URL and resolve Bing redirect
                          article_url = entry.link

                          # Bing News uses apiclick.aspx redirects - follow them
                          if 'bing.com/news/apiclick' in article_url:
                              try:
                                  print(f"   🔗 Resolving Bing redirect...")
                                  response = requests.head(article_url, allow_redirects=True, timeout=10,
                                                          headers={'User-Agent': 'Mozilla/5.0'})
                                  if response.url and response.url != article_url:
                                      article_url = response.url
                                      print(f"   ✅ Direct URL: {article_url[:80]}...")
                                  else:
                                      print(f"   ⚠️  Could not resolve, using Bing link")
                              except Exception as e:
                                  print(f"   ⚠️  Redirect error: {e}")

                          # Extract source from the actual article URL domain
                          source_name = entry.source.title if hasattr(entry, 'source') else 'Bing News'

                          # Try to get cleaner source name from resolved URL
                          if article_url and 'bing.com' not in article_url:
                              try:
                                  from urllib.parse import urlparse
                                  domain = urlparse(article_url).netloc
                                  # Clean up domain (remove www., extract main name)
                                  domain = domain.replace('www.', '')
                                  # Capitalize first letter
                                  if domain:
                                      source_name = domain.split('.')[0].capitalize()
                              except:
                                  pass  # Keep RSS source name if URL parsing fails

                          news_articles.append({
                              'title': clean_title,
                              'original_title': entry.title,
                              'link': article_url,
                              'source': source_name,
                              'published': published,
                              'summary': entry.summary if hasattr(entry, 'summary') else '',
                              'relevance': relevance
                          })
                          print(f"   ✅ Included: {clean_title[:60]}... (relevance: {relevance})")
                  except Exception as e:
                      print(f"   ⚠️  Error processing entry: {e}")
                      continue

              print(f"✅ Found {len(news_articles)} recent articles from Bing News")
          except Exception as e:
              print(f"⚠️  Error fetching Bing News: {e}")

          # Source 2: Google News RSS (backup for Bing)
          try:
              bing_count = len(news_articles)  # Track articles from Bing
              print("\n📰 Checking Google News...")
              # Google News RSS for VinFast
              google_news_url = "https://news.google.com/rss/search?q=VinFast&hl=en-US&gl=US&ceid=US:en"
              feed = feedparser.parse(google_news_url)

              for entry in feed.entries[:50]:  # Check top 50 entries
                  try:
                      published = datetime(*entry.published_parsed[:6])

                      if published > cutoff_time:
                          title = entry.title.lower()
                          summary = entry.summary.lower() if hasattr(entry, 'summary') else ''

                          # STRICT FILTER: Must have "vinfast" prominently in title or first 200 chars of summary
                          vinfast_in_title = 'vinfast' in title
                          vinfast_in_early_summary = 'vinfast' in summary[:200] if summary else False

                          # Skip if VinFast is not prominently featured
                          if not (vinfast_in_title or vinfast_in_early_summary):
                              continue

                          # Additional exclusion filters for common false positives
                          exclusion_keywords = [
                              'rivian', 'tesla', 'lucid', 'nio', 'xpeng', 'byd only',
                              'general motors', 'ford motor', 'volkswagen group',
                              'ev stocks', 'ev market', 'ev sector', 'chinese evs'
                          ]

                          # Check if article is primarily about other EVs/companies
                          is_excluded = False
                          for exclude_word in exclusion_keywords:
                              if exclude_word in title and 'vinfast' not in title:
                                  is_excluded = True
                                  break

                          if is_excluded:
                              continue

                          # Block known SEO spam domains and garbage content patterns
                          spam_sources = ['newser.com', 'newser']
                          garbage_patterns = [
                              'equity warrant', 'technical indicators', 'price floor',
                              'momentum shifts', 'forecast', 'time series', 'drawdowns',
                              'statistical tools', 'reversal', 'sector etf'
                          ]

                          article_url = entry.link.lower()

                          # Skip spam sources
                          if any(spam_domain in article_url for spam_domain in spam_sources):
                              continue

                          # Skip garbage financial content
                          is_garbage = any(pattern in title for pattern in garbage_patterns)
                          if is_garbage:
                              continue

                          # Calculate relevance score (for North America priority)
                          relevance = 0
                          for keyword in na_keywords:
                              if keyword in title:
                                  relevance += 3  # Title matches worth more
                              if keyword in summary:
                                  relevance += 1

                          # Boost relevance if VinFast is in title
                          if vinfast_in_title:
                              relevance += 5

                          # Clean title - remove source suffix
                          clean_title = entry.title
                          if ' - ' in clean_title:
                              clean_title = clean_title.rsplit(' - ', 1)[0].strip()

                          # Extract source from entry
                          source_name = 'Google News'
                          if hasattr(entry, 'source') and hasattr(entry.source, 'title'):
                              source_name = entry.source.title

                          # Try to get cleaner source name from URL
                          article_url = entry.link
                          try:
                              from urllib.parse import urlparse
                              domain = urlparse(article_url).netloc
                              domain = domain.replace('www.', '')
                              if domain and 'google.com' not in domain:
                                  source_name = domain.split('.')[0].capitalize()
                          except:
                              pass

                          news_articles.append({
                              'title': clean_title,
                              'original_title': entry.title,
                              'link': article_url,
                              'source': source_name,
                              'published': published,
                              'summary': entry.summary if hasattr(entry, 'summary') else '',
                              'relevance': relevance
                          })
                          print(f"   ✅ Included: {clean_title[:60]}... (relevance: {relevance})")
                  except Exception as e:
                      print(f"   ⚠️  Error processing entry: {e}")
                      continue

              google_count = len(news_articles) - bing_count
              print(f"✅ Found {google_count} recent articles from Google News")
          except Exception as e:
              print(f"⚠️  Error fetching Google News: {e}")

          # Source 3: Check VinFast official news (if available)
          try:
              print("📰 Checking VinFast official website...")
              # Note: VinFast doesn't have an RSS feed, but we check the main news page
              vf_response = requests.get('https://vinfastauto.us/newsroom', timeout=10)
              if vf_response.status_code == 200:
                  print("✅ VinFast newsroom accessible")
              # We'd need to parse HTML here for actual articles
              # For now, just verify site is accessible
          except Exception as e:
              print(f"⚠️  VinFast newsroom check: {e}")

          # Smart duplicate detection - check title similarity
          def title_similarity(title1, title2):
              """Check if two titles are talking about the same story"""
              # Normalize titles
              t1 = title1.lower().strip()
              t2 = title2.lower().strip()

              # Remove common words
              stop_words = {'the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for',
                          'of', 'with', 'by', 'from', 'as', 'is', 'was', 'are', 'were', 'be',
                          'has', 'have', 'had', 'will', 'can', 'could', 'should'}

              words1 = set(word for word in t1.split() if word not in stop_words and len(word) > 3)
              words2 = set(word for word in t2.split() if word not in stop_words and len(word) > 3)

              if not words1 or not words2:
                  return 0

              # Calculate overlap
              overlap = len(words1 & words2) / max(len(words1), len(words2))
              return overlap

          # Remove duplicates using smart similarity detection
          unique_articles = []
          seen_titles = []

          for article in news_articles:
              is_duplicate = False

              for seen_title in seen_titles:
                  similarity = title_similarity(article['title'], seen_title)
                  if similarity > 0.6:  # 60% similar = duplicate
                      is_duplicate = True
                      print(f"   🔄 Skipping duplicate: {article['title'][:50]}...")
                      break

              if not is_duplicate:
                  unique_articles.append(article)
                  seen_titles.append(article['title'])

          # Sort by relevance first (North America priority), then by date
          sorted_articles = sorted(
              unique_articles,
              key=lambda x: (x['relevance'], x['published']),
              reverse=True
          )[:5]  # Top 5 most relevant and recent

          print(f"📊 Total unique articles: {len(unique_articles)}")
          print(f"📊 Posting top {len(sorted_articles)} articles (North America priority)")

          # Build Discord embed
          if sorted_articles:
              today = datetime.now().strftime("%B %d, %Y")

              # Main embed with articles
              description = f"📰 **Latest VinFast News - {today}**\n\n"
              description += f"*Top stories from the last 24 hours*\n\n"

              for i, article in enumerate(sorted_articles, 1):
                  title = article['title']
                  # Remove source name from title if present
                  if ' - ' in title:
                      title = title.split(' - ')[0].strip()

                  # Truncate title if too long
                  if len(title) > 100:
                      title = title[:97] + "..."

                  source = article['source']
                  link = article['link']
                  time_ago = datetime.now() - article['published']

                  if time_ago.seconds < 3600:
                      time_str = f"{time_ago.seconds // 60}m ago"
                  elif time_ago.seconds < 86400:
                      time_str = f"{time_ago.seconds // 3600}h ago"
                  else:
                      time_str = f"{time_ago.days}d ago"

                  description += f"**{i}.** [{title}]({link})\n"
                  description += f"    📍 {source} • 🕒 {time_str}\n\n"

              embed = {
                  "title": "🚗 VinFast Daily News Roundup",
                  "description": description,
                  "color": 0x00539C,  # VinFast blue
                  "footer": {
                      "text": "News from Bing News & Google News | Automated by VinFastOwners.org"
                  },
                  "timestamp": datetime.utcnow().isoformat()
              }

              # Add helpful links field
              embed["fields"] = [
                  {
                      "name": "📰 More News Sources",
                      "value": (
                          "• [VinFast Newsroom](https://vinfastauto.us/newsroom)\n"
                          "• [VinFastTalk.com](https://vinfasttalk.com)\n"
                          "• [Bing News Search](https://www.bing.com/news/search?q=VinFast)"
                      ),
                      "inline": False
                  }
              ]

              payload = {
                  "username": "VinFast News Bot",
                  "avatar_url": "https://raw.githubusercontent.com/vinfastownersorg-cyber/avo-website/main/images/icons/avo-logo.png",
                  "embeds": [embed]
              }

              # Post to Discord
              response = requests.post(webhook_url, json=payload)

              if response.status_code == 204:
                  print("✅ Successfully posted news to Discord")
                  print(f"📊 Posted {len(sorted_articles)} articles")
              else:
                  print(f"❌ Failed to post to Discord: {response.status_code}")
                  print(response.text)
                  sys.exit(1)

          else:
              # No new articles found
              print("ℹ️  No recent VinFast news articles found in last 24 hours")

              # Post a message saying no news today
              embed = {
                  "title": "🚗 VinFast Daily News Roundup",
                  "description": (
                      f"📰 **No Major News Today - {datetime.now().strftime('%B %d, %Y')}**\n\n"
                      "No significant VinFast news articles found in the last 24 hours.\n\n"
                      "Check back tomorrow for updates!"
                  ),
                  "color": 0x808080,  # Gray
                  "footer": {
                      "text": "News from Bing News & Google News | Automated by VinFastOwners.org"
                  },
                  "timestamp": datetime.utcnow().isoformat(),
                  "fields": [
                      {
                          "name": "📰 More News Sources",
                          "value": (
                              "• [VinFast Newsroom](https://vinfastauto.us/newsroom)\n"
                              "• [VinFastTalk.com](https://vinfasttalk.com)\n"
                              "• [Google News Search](https://news.google.com/search?q=VinFast)"
                          ),
                          "inline": False
                      }
                  ]
              }

              payload = {
                  "username": "VinFast News Bot",
                  "avatar_url": "https://raw.githubusercontent.com/vinfastownersorg-cyber/avo-website/main/images/icons/avo-logo.png",
                  "embeds": [embed]
              }

              response = requests.post(webhook_url, json=payload)

              if response.status_code == 204:
                  print("✅ Posted 'no news' message to Discord")
              else:
                  print(f"❌ Failed to post to Discord: {response.status_code}")
                  sys.exit(1)

          EOF

      - name: Check VinFast website sitemaps for updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os
          import sys
          from datetime import datetime
          from xml.etree import ElementTree as ET

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL')

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK_URL secret not set")
              sys.exit(1)

          print("🗺️  Checking VinFast website sitemaps for changes...")

          # Sitemap URLs to monitor
          sitemaps = {
              'vinfastauto.us': 'https://vinfastauto.us/sitemap.xml',
              'vinfastauto.ca': 'https://vinfastauto.ca/sitemap.xml'
          }

          # Storage file for previous sitemap state
          sitemap_state_file = '.github/sitemap-state.json'

          # Load previous state
          previous_state = {}
          if os.path.exists(sitemap_state_file):
              try:
                  with open(sitemap_state_file, 'r') as f:
                      previous_state = json.load(f)
                  print(f"✅ Loaded previous sitemap state ({len(previous_state)} sites)")
              except Exception as e:
                  print(f"⚠️  Could not load previous state: {e}")

          # Start with previous state so sites that error don't lose their saved state
          current_state = dict(previous_state)
          all_changes = []

          for site_name, sitemap_url in sitemaps.items():
              print(f"\n📍 Checking {site_name}...")

              try:
                  # Fetch sitemap
                  response = requests.get(sitemap_url, timeout=15)
                  print(f"   HTTP {response.status_code} from {sitemap_url}")

                  if response.status_code == 200:
                      # Parse XML
                      root = ET.fromstring(response.content)

                      # Extract namespace
                      namespace = {'ns': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

                      # Extract all URLs
                      urls = []
                      for url_elem in root.findall('.//ns:url', namespace):
                          loc = url_elem.find('ns:loc', namespace)
                          lastmod = url_elem.find('ns:lastmod', namespace)

                          if loc is not None:
                              url_data = {
                                  'loc': loc.text,
                                  'lastmod': lastmod.text if lastmod is not None else None
                              }
                              urls.append(url_data)

                      current_state[site_name] = {
                          'urls': urls,
                          'count': len(urls),
                          'last_checked': datetime.utcnow().isoformat()
                      }

                      print(f"✅ Found {len(urls)} URLs in {site_name} sitemap")

                      # Compare with previous state
                      if site_name in previous_state:
                          prev_urls = {u['loc'] for u in previous_state[site_name]['urls']}
                          curr_urls = {u['loc'] for u in urls}

                          new_urls = curr_urls - prev_urls
                          removed_urls = prev_urls - curr_urls

                          # Check for modified URLs (lastmod changed)
                          modified_urls = []
                          prev_url_dict = {u['loc']: u['lastmod'] for u in previous_state[site_name]['urls']}
                          curr_url_dict = {u['loc']: u['lastmod'] for u in urls}

                          for url in curr_urls & prev_urls:  # Intersection
                              if prev_url_dict[url] != curr_url_dict[url]:
                                  if curr_url_dict[url]:  # Only if lastmod exists
                                      modified_urls.append(url)

                          if new_urls or removed_urls or modified_urls:
                              all_changes.append({
                                  'site': site_name,
                                  'new': list(new_urls),
                                  'removed': list(removed_urls),
                                  'modified': modified_urls
                              })

                              print(f"  🆕 New URLs: {len(new_urls)}")
                              print(f"  🗑️  Removed URLs: {len(removed_urls)}")
                              print(f"  📝 Modified URLs: {len(modified_urls)}")

                              for url in list(new_urls)[:5]:  # Show first 5
                                  print(f"    + {url}")
                          else:
                              print(f"  ✓ No changes detected")
                      else:
                          print(f"  ℹ️  First time checking {site_name} (no comparison)")

                  elif response.status_code == 403:
                      print(f"⚠️  {site_name} blocked access (403)")
                  elif response.status_code == 404:
                      print(f"⚠️  {site_name} sitemap not found (404)")
                  else:
                      print(f"⚠️  {site_name} returned status {response.status_code}")

              except Exception as e:
                  print(f"❌ Error checking {site_name}: {e}")
                  # Keep previous state for this site if it exists (don't lose it on error)
                  if site_name in previous_state:
                      print(f"   ℹ️  Preserving previous state for {site_name}")

          # Save current state (includes preserved state for errored sites)
          try:
              os.makedirs(os.path.dirname(sitemap_state_file), exist_ok=True)
              with open(sitemap_state_file, 'w') as f:
                  json.dump(current_state, f, indent=2)
              print(f"\n✅ Saved current sitemap state")
          except Exception as e:
              print(f"⚠️  Could not save state: {e}")

          # Post changes to Discord
          if all_changes:
              print(f"\n📢 Posting {len(all_changes)} site updates to Discord...")

              description = "🗺️ **VinFast Website Updates Detected**\n\n"

              for change in all_changes:
                  site = change['site']
                  new_count = len(change['new'])
                  removed_count = len(change['removed'])
                  modified_count = len(change['modified'])

                  description += f"**{site}**\n"

                  if new_count > 0:
                      description += f"🆕 **{new_count} new page(s)**\n"
                      for url in change['new']:  # Show ALL new pages
                          # Extract page path
                          path = url.replace(f'https://{site}', '').replace('http://', '')
                          # Truncate long paths to keep embed readable
                          if len(path) > 80:
                              path = path[:77] + '...'
                          description += f"  • [{path}]({url})\n"
                      description += "\n"

                  if modified_count > 0:
                      description += f"📝 **{modified_count} updated page(s)**\n"
                      for url in change['modified']:  # Show ALL modified pages
                          path = url.replace(f'https://{site}', '').replace('http://', '')
                          # Truncate long paths to keep embed readable
                          if len(path) > 80:
                              path = path[:77] + '...'
                          description += f"  • [{path}]({url})\n"
                      description += "\n"

                  if removed_count > 0:
                      description += f"🗑️ **{removed_count} removed page(s)**\n"
                      for url in change['removed']:  # Show ALL removed pages
                          path = url.replace(f'https://{site}', '').replace('http://', '')
                          # Truncate long paths to keep embed readable
                          if len(path) > 80:
                              path = path[:77] + '...'
                          description += f"  • {path}\n"  # No link for removed pages
                      description += "\n"

              # Discord embed description limit is 4096 characters
              # If description is too long, truncate with warning
              if len(description) > 4000:
                  print(f"⚠️  Description too long ({len(description)} chars), truncating...")
                  description = description[:3900] + "\n\n*...output truncated (too many changes)*"

              embed = {
                  "title": "🌐 VinFast Website Changes",
                  "description": description,
                  "color": 0x00539C,
                  "footer": {
                      "text": "Sitemap Monitor | Automated by VinFastOwners.org"
                  },
                  "timestamp": datetime.utcnow().isoformat()
              }

              payload = {
                  "username": "VinFast Website Monitor",
                  "avatar_url": "https://raw.githubusercontent.com/vinfastownersorg-cyber/avo-website/main/images/icons/avo-logo.png",
                  "embeds": [embed]
              }

              response = requests.post(webhook_url, json=payload)

              if response.status_code == 204:
                  print("✅ Posted website changes to Discord")
              else:
                  print(f"⚠️  Discord post failed: {response.status_code}")
                  print(f"Response: {response.text}")
          else:
              print("\nℹ️  No website changes detected")

          EOF

      - name: Monitor VinFast page content for changes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
        run: |
          python3 << 'EOF'
          import requests
          import hashlib
          import json
          import os
          import re
          import sys
          from datetime import datetime

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL')

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK_URL secret not set")
              sys.exit(1)

          print("🔍 Monitoring VinFast pages for content changes...")

          # Pages to monitor (not reliably covered by sitemap)
          PAGES_TO_MONITOR = {
              'US Investor Relations': 'https://vinfastauto.us/investor-relations/',
              'US Newsroom': 'https://vinfastauto.us/newsroom',
              'CA Newsroom (EN)': 'https://vinfastauto.ca/en/newsroom',
              'US Homepage': 'https://vinfastauto.us/',
              'CA Homepage': 'https://vinfastauto.ca/en',
              'VinFast Owners': 'https://vinfastowners.org',
          }

          state_file = '.github/page-monitor-state.json'

          # Load previous state
          previous_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, 'r') as f:
                      previous_state = json.load(f)
                  print(f"✅ Loaded previous page state ({len(previous_state)} pages)")
              except Exception as e:
                  print(f"⚠️  Could not load previous state: {e}")

          current_state = {}
          changes_detected = []

          for page_name, page_url in PAGES_TO_MONITOR.items():
              print(f"\n📄 Checking: {page_name} ({page_url})")

              try:
                  response = requests.get(page_url, timeout=20, headers={
                      'User-Agent': 'Mozilla/5.0 (compatible; VinFastOwnersBot/1.0)'
                  })

                  if response.status_code != 200:
                      print(f"   ⚠️  HTTP {response.status_code} - skipping")
                      # Preserve previous state for this page
                      if page_name in previous_state:
                          current_state[page_name] = previous_state[page_name]
                      continue

                  # Strip HTML tags to get text content (avoids false positives from CSS/JS changes)
                  html_content = response.text
                  # Remove script and style blocks entirely
                  text = re.sub(r'<script[^>]*>.*?</script>', '', html_content, flags=re.DOTALL | re.IGNORECASE)
                  text = re.sub(r'<style[^>]*>.*?</style>', '', text, flags=re.DOTALL | re.IGNORECASE)
                  # Remove all HTML tags
                  text = re.sub(r'<[^>]+>', ' ', text)
                  # Normalize whitespace
                  text = re.sub(r'\s+', ' ', text).strip()

                  # Hash the text content
                  content_hash = hashlib.sha256(text.encode('utf-8')).hexdigest()

                  current_state[page_name] = {
                      'url': page_url,
                      'hash': content_hash,
                      'last_checked': datetime.utcnow().isoformat(),
                      'content_length': len(text)
                  }

                  # Compare with previous state
                  if page_name in previous_state:
                      prev_hash = previous_state[page_name].get('hash', '')
                      if prev_hash and prev_hash != content_hash:
                          prev_len = previous_state[page_name].get('content_length', 0)
                          curr_len = len(text)
                          len_diff = curr_len - prev_len
                          print(f"   🔔 CHANGE DETECTED! (content length: {prev_len} -> {curr_len}, diff: {len_diff:+d})")
                          changes_detected.append({
                              'name': page_name,
                              'url': page_url,
                              'prev_length': prev_len,
                              'curr_length': curr_len,
                              'length_diff': len_diff
                          })
                      else:
                          print(f"   ✓ No change (hash matches)")
                  else:
                      print(f"   ℹ️  First check - baseline recorded")

              except Exception as e:
                  print(f"   ❌ Error: {e}")
                  # Preserve previous state on error
                  if page_name in previous_state:
                      current_state[page_name] = previous_state[page_name]

          # Save current state
          try:
              os.makedirs(os.path.dirname(state_file), exist_ok=True)
              with open(state_file, 'w') as f:
                  json.dump(current_state, f, indent=2)
              print(f"\n✅ Saved page monitor state ({len(current_state)} pages)")
          except Exception as e:
              print(f"⚠️  Could not save page state: {e}")

          # Post changes to Discord
          if changes_detected:
              print(f"\n📢 Posting {len(changes_detected)} page change(s) to Discord...")

              description = "🔍 **VinFast Page Content Changes Detected**\n\n"
              description += "*The following pages have updated content:*\n\n"

              for change in changes_detected:
                  diff_str = f"{change['length_diff']:+d}" if change['length_diff'] != 0 else "~0"
                  description += f"🔔 **[{change['name']}]({change['url']})**\n"
                  description += f"   Content length: {change['prev_length']:,} → {change['curr_length']:,} chars ({diff_str})\n\n"

              description += "*Check these pages for new announcements, filings, or updates.*"

              embed = {
                  "title": "🌐 VinFast Page Update Alert",
                  "description": description,
                  "color": 0xFF6600,  # Orange for attention
                  "footer": {
                      "text": "Page Content Monitor | Automated by VinFastOwners.org"
                  },
                  "timestamp": datetime.utcnow().isoformat()
              }

              payload = {
                  "username": "VinFast Website Monitor",
                  "avatar_url": "https://raw.githubusercontent.com/vinfastownersorg-cyber/avo-website/main/images/icons/avo-logo.png",
                  "embeds": [embed]
              }

              response = requests.post(webhook_url, json=payload)

              if response.status_code == 204:
                  print("✅ Posted page changes to Discord")
              else:
                  print(f"⚠️  Discord post failed: {response.status_code}")
                  print(f"Response: {response.text}")
          else:
              print("\nℹ️  No page content changes detected")

          EOF

      - name: Commit monitoring state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/sitemap-state.json .github/page-monitor-state.json || true
          git diff --quiet --cached || git commit -m "Update website monitoring state [skip ci]"
          git push || true

      - name: Log completion
        if: always()
        run: |
          echo "VinFast news workflow completed at $(date)"
